<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MSIT Movie{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app-layout">

    <aside class="sidebar">
        <a class="brand" href="{{ url_for('home') }}">
            <span class="brand-icon">MS</span>
            <div class="brand-text">
                <strong>MSIT Movie</strong>
                <small>Movie Collection</small>
            </div>
        </a>

        <nav class="sidebar-nav">
            <a
                href="{{ url_for('home') }}"
                class="nav-link {% if request.endpoint == 'home' %}active{% endif %}">
                Collections
            </a>
        </nav>
    </aside>

    <main class="main-content">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category if category in ['success', 'error'] else 'info' }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

</div>

</body>
</html>
